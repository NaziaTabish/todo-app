[project]
name = "todo-console-app"
version = "0.1.0"
description = "Phase I: In-Memory Python Console Todo App for Hackathon II"
requires-python = ">=3.13"
authors = [
    {name = "Hackathon II Team", email = "team@example.com"}
]
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ['py313']

[tool.pycodestyle]
max-line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist"
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv"
]
